name: contracts

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Format check
        run: forge fmt --check
      - name: Build
        run: forge build
      - name: Test
        run: forge test -vv
      - name: Frontend syntax
        run: |
          node --check web/app.js
          node --check web/config.js
          python3 -m py_compile scripts/web/apply-manifest.py
      - name: Receipt proof regressions
        run: python3 -m unittest discover -s test/evidence -v
      - name: Dashboard proof and guardian controls
        run: node --test test/web/proof.test.mjs

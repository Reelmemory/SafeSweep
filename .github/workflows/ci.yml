name: contracts

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Format check
        run: forge fmt --check
      - name: Build
        run: forge build
      - name: Browser dependencies and contract export
        run: |
          npm ci
          npm run build:web
      - name: Test
        run: forge test -vv
      - name: Frontend syntax
        run: |
          node --check web/app.js
          node --check web/config.js
          node --check web/protection-core.mjs
          node --check web/protection.mjs
          python3 -m py_compile scripts/web/apply-manifest.py
      - name: Receipt proof regressions
        run: python3 -m unittest discover -s test/evidence -v
      - name: Dashboard proof and guardian controls
        run: npm test
      - name: Browser setup and two-chain evacuation
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          SAFESWEEP_BROWSER=chromium npm run test:protection
